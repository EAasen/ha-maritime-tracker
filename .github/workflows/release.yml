name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Release validation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests with coverage gate
        run: >-
          pytest tests/ -v
          --cov=custom_components.marinetraffic_tracker
          --cov-report=term-missing
          --cov-fail-under=80

  validate:
    name: Release validation checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON metadata files
        run: |
          python -m json.tool custom_components/marinetraffic_tracker/manifest.json > /dev/null
          python -m json.tool hacs.json > /dev/null

      - name: Run HACS validation
        uses: hacs/action@1.0.0
        with:
          category: integration

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@22.5.0

  release:
    name: Create GitHub release
    needs:
      - test
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
