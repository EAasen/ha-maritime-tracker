name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Black / isort / flake8 / mypy / pylint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Black
        run: black --check custom_components tests

      - name: Run isort
        run: isort --check-only custom_components tests

      - name: Run flake8
        run: flake8 custom_components tests

      - name: Run mypy
        run: mypy

      - name: Run pylint
        run: pylint custom_components

      - name: Publish code quality metrics
        if: always()
        run: |
          {
            echo "### Code quality metrics"
            echo
            echo "- Python files checked: $(find custom_components tests -name '*.py' | wc -l)"
            echo "- Production modules: $(find custom_components -name '*.py' | wc -l)"
            echo "- Test modules: $(find tests -name '*.py' | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
