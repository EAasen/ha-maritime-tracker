name: HA Version Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC to catch upstream HA changes.
    - cron: "0 6 * * 1"

jobs:
  compatibility:
    name: "HA ${{ matrix.ha-version }} (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Each Home Assistant release has a hard Requires-Python floor, so the
        # interpreter is pinned per entry. Releases before 2025.1 are excluded:
        # they no longer build or run on any currently available Python.
        include:
          - ha-version: "2025.1.0"
            python-version: "3.12"
          - ha-version: "2026.1.0"
            python-version: "3.13"
          - ha-version: "2026.9.0"
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies pinned to HA ${{ matrix.ha-version }}
        run: |
          pip install \
            "homeassistant==${{ matrix.ha-version }}" \
            pytest \
            pytest-homeassistant-custom-component \
            pytest-asyncio \
            aiohttp \
            aioresponses

      - name: Run compatibility test suite
        run: |
          pytest tests/test_ha_version_compatibility.py -v
