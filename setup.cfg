[flake8]
max-line-length = 100
max-complexity = 25
extend-ignore =
    # E203: whitespace before ':' — conflicts with Black
    E203,
    # W503: line break before binary operator — conflicts with Black
    W503,
    # E501: line too long — handled by Black/ruff
    E501,
    # E302: expected 2 blank lines — handled by ruff formatter
    E302,
per-file-ignores =
    # S101: assert statements are acceptable in tests
    tests/*:S101
exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .ruff_cache,
